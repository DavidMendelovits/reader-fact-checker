<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AEC probe — can SpeechRecognition take our own stream?</title>
<style>
  body { font: 16px/1.55 ui-sans-serif, system-ui, sans-serif; max-width: 44rem; margin: 3rem auto; padding: 0 1.25rem; color: #1a1714; background: #faf8f5; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  p.sub { color: #6b625a; margin-top: 0; }
  button { font: inherit; padding: .6rem 1.1rem; border: 0; border-radius: .4rem; background: #1a1714; color: #faf8f5; cursor: pointer; }
  button[disabled] { opacity: .4; cursor: default; }
  #log { margin-top: 1.5rem; white-space: pre-wrap; font: 13px/1.6 ui-monospace, monospace; background: #fff; border: 1px solid #e6e0d8; border-radius: .5rem; padding: 1rem; }
  #verdict { margin-top: 1.5rem; padding: 1rem 1.25rem; border-radius: .5rem; border: 1px solid #e6e0d8; background: #fff; display: none; }
  #verdict.yes { border-color: #1f7a4d; background: #eef8f2; }
  #verdict.no { border-color: #a33; background: #fdf0ef; }
  #verdict.meh { border-color: #b7891f; background: #fdf7e8; }
  #verdict h2 { font-size: 1.05rem; margin: 0 0 .5rem; }
  #meter { height: .5rem; background: #e6e0d8; border-radius: 1rem; overflow: hidden; margin-top: 1rem; }
  #meter div { height: 100%; width: 0; background: #1f7a4d; transition: width .08s linear; }
  code { background: #f1ece5; padding: .1rem .3rem; border-radius: .25rem; }
</style>

<h1>Can Chrome's SpeechRecognition take our own audio stream?</h1>
<p class="sub">
  If it can, we hand it an echo-cancelled <code>getUserMedia</code> stream and speakerphone
  barge-in mostly works. If it can't, Web Speech and AEC are mutually exclusive.
</p>

<button id="run">Run probe</button>
<div id="meter"><div></div></div>
<div id="verdict"></div>
<pre id="log"></pre>

<script>
  const logEl = document.getElementById('log')
  const meterEl = document.querySelector('#meter div')
  const verdictEl = document.getElementById('verdict')
  const runBtn = document.getElementById('run')

  const log = (msg) => { logEl.textContent += msg + '\n' }

  function verdict(kind, title, body) {
    verdictEl.className = kind
    verdictEl.style.display = 'block'
    verdictEl.innerHTML = `<h2>${title}</h2><div>${body}</div>`
  }

  const LISTEN_MS = 7000
  // enough energy for long enough that "they said nothing" isn't a live explanation
  const SPEECH_RMS = 0.02
  const SPEECH_FRAMES = 20

  runBtn.onclick = async () => {
    runBtn.disabled = true
    logEl.textContent = ''
    verdictEl.style.display = 'none'

    const Ctor = window.SpeechRecognition ?? window.webkitSpeechRecognition
    log(`SpeechRecognition:      ${Ctor ? 'present' : 'MISSING'}`)
    log(`getUserMedia:           ${navigator.mediaDevices?.getUserMedia ? 'present' : 'MISSING'}`)
    if (!Ctor || !navigator.mediaDevices?.getUserMedia) {
      verdict('no', 'Not testable in this browser', 'Run this in desktop Chrome.')
      runBtn.disabled = false
      return
    }

    // --- what the device actually gives us when we ask for echo cancellation ---
    let mic
    try {
      mic = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      })
    } catch (e) {
      log(`\ngetUserMedia failed: ${e.name} — ${e.message}`)
      verdict('no', 'No microphone', 'Grant mic access and run again.')
      runBtn.disabled = false
      return
    }

    const track = mic.getAudioTracks()[0]
    const settings = track.getSettings()
    log(`\nDevice: ${track.label || '(unlabelled)'}`)
    log(`  echoCancellation:     ${settings.echoCancellation}`)
    log(`  noiseSuppression:     ${settings.noiseSuppression}`)
    log(`  autoGainControl:      ${settings.autoGainControl}`)
    if (settings.echoCancellation === false) {
      log('  ^ this device refused AEC — common over Bluetooth, and fatal for speaker mode')
    }

    // --- mic level, so "no transcript" can be told apart from "said nothing" ---
    const ctx = new AudioContext()
    const analyser = ctx.createAnalyser()
    analyser.fftSize = 1024
    ctx.createMediaStreamSource(mic).connect(analyser)
    const buf = new Float32Array(analyser.fftSize)
    let loudFrames = 0
    const meter = setInterval(() => {
      analyser.getFloatTimeDomainData(buf)
      let sum = 0
      for (const v of buf) sum += v * v
      const rms = Math.sqrt(sum / buf.length)
      if (rms > SPEECH_RMS) loudFrames++
      meterEl.style.width = `${Math.min(100, rms * 400)}%`
    }, 50)

    // --- the probe ---
    //
    // A silent track, generated by WebAudio so it is definitely silent. If Chrome
    // honours the argument, recognition hears nothing no matter how loud you talk.
    // If it ignores it — which is what plain JS argument-dropping looks like — it
    // opens the default mic and transcribes you. Passing a bad argument can't be
    // detected by catching a throw, so the difference has to be observed.
    const silence = ctx.createMediaStreamDestination()
    const silentTrack = silence.stream.getAudioTracks()[0]

    const rec = new Ctor()
    rec.continuous = true
    rec.interimResults = true
    rec.lang = 'en-US'

    let heard = ''
    let recError = ''
    rec.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) heard += e.results[i][0].transcript
    }
    rec.onerror = (e) => { recError = e.error }

    log(`\nStarting recognition against a silent WebAudio track.`)
    log(`TALK NOW — out loud, for ${LISTEN_MS / 1000} seconds. Say anything.`)

    try {
      rec.start(silentTrack)
    } catch (e) {
      log(`\nstart(track) threw: ${e.name} — ${e.message}`)
      clearInterval(meter)
      mic.getTracks().forEach((t) => t.stop())
      verdict('no', 'Rejected outright', 'Chrome will not take a track. See the not-supported options below.')
      runBtn.disabled = false
      return
    }

    await new Promise((r) => setTimeout(r, LISTEN_MS))
    rec.stop()
    clearInterval(meter)
    meterEl.style.width = '0'
    mic.getTracks().forEach((t) => t.stop())
    void ctx.close()

    log(`\nrecognition error:      ${recError || '(none)'}`)
    log(`frames above threshold: ${loudFrames} (need ${SPEECH_FRAMES})`)
    log(`transcript:             ${heard.trim() ? JSON.stringify(heard.trim()) : '(nothing)'}`)

    if (loudFrames < SPEECH_FRAMES) {
      verdict('meh', 'Inconclusive — I never heard you',
        'The mic stayed quiet, so an empty transcript proves nothing. Run it again and talk continuously.')
    } else if (heard.trim()) {
      verdict('no', 'Not supported — the track was ignored',
        'You spoke and it transcribed you, which means recognition opened the default mic and dropped the argument. ' +
        'Web Speech and our own echo-cancelled stream cannot be combined. Options: headphones-only, push-to-talk for ' +
        'speaker mode, or replace the input path with getUserMedia + streaming ASR.')
    } else {
      verdict('yes', 'Supported — the track was honoured',
        'You spoke and it transcribed nothing, so recognition really was listening to the silent track we handed it. ' +
        'Swap that for the echo-cancelled mic stream and speakerphone barge-in becomes a small change to voice.ts.')
    }
    runBtn.disabled = false
  }
</script>
